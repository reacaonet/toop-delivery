services:
  # ─── Infra ────────────────────────────────────────────

  admin-mongodb:
    container_name: toop-mongodb-prod
    image: mongo:5.0
    command: [--auth]
    restart: always
    volumes:
      - mongo_prod_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ecbr
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  payment-postgres:
    container_name: toop-postgres-prod
    image: postgres:13
    restart: always
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    container_name: toop-redis-prod
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Services ─────────────────────────────────────────

  admin-api:
    container_name: toop-admin-api-prod
    build:
      context: ./delivery_toop-admin/backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "8100:8100"
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8100
      MONGO_ADMIN_USER: ${MONGO_ADMIN_USER}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      URL_MONGO: mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASSWORD}@admin-mongodb:27017/ecbr?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH}
      PAYMENT_URL: http://payment-microservice:8400
      NOTIFICATION_URL: http://notification-microservice:8200
      DELIVERYMAN_URL: http://deliveryman-microservice:8300
      NOTIFICATION_API_KEY: ${APP_KEY}
      GOOGLE_MAPS: ${GOOGLE_MAPS}
    depends_on:
      admin-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  payment-microservice:
    container_name: toop-payment-prod
    build:
      context: ./delivery_toop-microservice_payment
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8400
      POSTGRES_HOST: payment-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      payment-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  notification-microservice:
    container_name: toop-notification-prod
    build:
      context: ./delivery_toop-microservice_notification
      dockerfile: Dockerfile
      target: production
    restart: always
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH}:/usr/src/app/firebase-adminsdk.json:ro
    environment:
      NODE_ENV: production
      PORT: 8200
      DB_HOST: admin-mongodb
      DB_PORT: 27017
      DB_DATABASE: ecbr
      DB_USER: ${MONGO_ADMIN_USER}
      DB_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_serviceAccount: ${FIREBASE_serviceAccount}
      FIREBASE_databaseURL: ${FIREBASE_databaseURL}
    depends_on:
      admin-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  deliveryman-microservice:
    container_name: toop-deliveryman-prod
    build:
      context: ./delivery_toop-microservice_deliveryman
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8300
      MONGO_DB_CONNECTION_STRING: mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASSWORD}@admin-mongodb:27017/ecbr?retryWrites=true&authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${APP_KEY}
    depends_on:
      admin-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Frontends ────────────────────────────────────────
  # Proxy externo (Cloudflare/CDN): gojadelivery.com.br -> :80,
  # admin. -> :8081, loja. -> :8082, entregador. -> :8083,
  # app. -> :8084, api. -> :8100

  landing:
    container_name: toop-landing-prod
    build:
      context: ./delivery_toop-landpage
      dockerfile: Dockerfile
      target: production
      args:
        VITE_CLIENT_URL: ${VITE_CLIENT_URL:-https://app.gojadelivery.com.br}
        VITE_STORE_URL: ${VITE_STORE_URL:-https://loja.gojadelivery.com.br}
        VITE_DELIVERYMAN_URL: ${VITE_DELIVERYMAN_URL:-https://entregador.gojadelivery.com.br}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-https://admin.gojadelivery.com.br}
    ports:
      - "80:80"
    restart: always
    depends_on:
      - admin-api
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend-admin:
    container_name: toop-frontend-admin-prod
    build:
      context: ./delivery_toop-admin/frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL_ADMIN:-https://api.gojadelivery.com.br}
    ports:
      - "8081:80"
    restart: always
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend-store:
    container_name: toop-frontend-store-prod
    build:
      context: ./delivery_toop-store
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL_STORE:-https://api.gojadelivery.com.br}
    ports:
      - "8082:80"
    restart: always
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend-deliveryman:
    container_name: toop-frontend-deliveryman-prod
    build:
      context: ./delivery_toop-deliveryman
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL_DELIVERYMAN:-https://api.gojadelivery.com.br}
    ports:
      - "8083:80"
    restart: always
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend-web-client:
    container_name: toop-frontend-web-client-prod
    build:
      context: ./delivery_toop-web-client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL_WEB_CLIENT:-https://api.gojadelivery.com.br}
    ports:
      - "8084:80"
    restart: always
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ─── Monitoring (rede interna) ────────────────────────

  prometheus:
    container_name: toop-prometheus-prod
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  grafana:
    container_name: toop-grafana-prod
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/toopdelivery-overview.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - toop-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mongo_prod_data:
  postgres_prod_data:
  redis_prod_data:
  prometheus_prod_data:
  grafana_prod_data:

networks:
  toop-network:
    driver: bridge