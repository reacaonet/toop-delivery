// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "30.0.2"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "23.0.7599858"
        kotlinVersion = "1.7.20"
        // googlePlayServicesVersion = "19+"
        // googlePlayServicesIidVersion = "19+"
        // androidMapsUtilsVersion = "2.2.3"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:4.2.1")
        classpath('com.google.gms:google-services:4.3.10')

        // classpath 'com.google.firebase:firebase-firestore:21.2.1'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}
def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())
allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        configurations.all{
            resolutionStrategy{
                force "com.google.android.gms:play-services-location:20.0.0"
            }
        }
    }

    subprojects {
      afterEvaluate {
        project ->
          if (project.hasProperty("android")) {
              android {
                compileSdkVersion = 33
                buildToolsVersion = "30.0.2"
              }
          }
      }
    }

    configurations.all {
      resolutionStrategy {
        force "com.facebook.react:react-native:" + REACT_NATIVE_VERSION
      }
    }
}
