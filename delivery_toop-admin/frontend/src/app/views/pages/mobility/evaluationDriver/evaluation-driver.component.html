<form [formGroup]="formFilter" *ngIf="formFilter" formFilter.valid style="margin-left: 10px;">
	<div class="row col-12 shadow pt-2 bg-light">
		<div class="form-group col-4">
			<label for="category">Motorista</label>
			<div class="input-group">
				<input type="text" class="form-control" matInput placeholder="Selecione Motorista"
					[matAutocomplete]="autoDriver" formControlName="driver" [ngClass]="{
						'is-invalid': formFilter && formFilter.get('driver').invalid
					}" style="background-color: #fff" />
				<mat-autocomplete [displayWith]="displayFn" #autoDriver="matAutocomplete">
					<mat-option *ngFor="let driver of listDriver" [value]="driver" (click)="onClickDriverFilter(driver)">
						{{ driver.name }}
					</mat-option>
				</mat-autocomplete>
			</div>
		</div>

		<div class="form-group col-4">
			<label for="category">Passageiro</label>
			<div class="input-group">
				<input type="text" class="form-control" matInput placeholder="Selecione Passageiro"
					[matAutocomplete]="autoPassenger" formControlName="passenger" [ngClass]="{
						'is-invalid': formFilter && formFilter.get('passenger').invalid
					}" />
				<mat-autocomplete [displayWith]="displayFn" #autoPassenger="matAutocomplete">
					<mat-option *ngFor="let passenger of listPassenger" [value]="passenger"
						(click)="onClickPassengerFilter(passenger)">
						{{ passenger.name }}
					</mat-option>
				</mat-autocomplete>
			</div>
		</div>
	</div>
</form>

<div class="example-container mat-elevation-z8 mt-3">
	<mat-table #table [dataSource]="dataSource">
		<!-- Checkbox Column -->
		<ng-container matColumnDef="select">
			<mat-header-cell *matHeaderCellDef>
				<mat-checkbox [checked]="true" [indeterminate]="true">
				</mat-checkbox>
			</mat-header-cell>
			<mat-cell *matCellDef="let row">
				<mat-checkbox (click)="$event.stopPropagation()">
				</mat-checkbox>
			</mat-cell>
		</ng-container>

		<ng-container matColumnDef="passenger">
			<mat-header-cell *matHeaderCellDef>Passageiro</mat-header-cell>
			<mat-cell *matCellDef="let element"> {{ element?.passenger?.person?.name }}
			</mat-cell>
		</ng-container>

		<ng-container matColumnDef="driver">
			<mat-header-cell *matHeaderCellDef>Motorista</mat-header-cell>
			<mat-cell *matCellDef="let element"> {{ element?.driver?.name }}</mat-cell>
		</ng-container>

		<ng-container matColumnDef="stars">
			<mat-header-cell *matHeaderCellDef>Avaliação</mat-header-cell>
			<mat-cell *matCellDef="let element">
				<ng-container *ngFor="let i of [].constructor(element.stars)">
					<span class="fa fa-star checked" style="color: orange;"></span>
				</ng-container>
			</mat-cell>
		</ng-container>

		<ng-container matColumnDef="description">
			<mat-header-cell *matHeaderCellDef>Comentário</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element?.description }}</mat-cell>
		</ng-container>

		<ng-container matColumnDef="createdAt">
			<mat-header-cell *matHeaderCellDef>Data</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element?.createdAt }}</mat-cell>
		</ng-container>

		<ng-container matColumnDef="action">
			<mat-header-cell *matHeaderCellDef>Ação</mat-header-cell>
			<mat-cell *matCellDef="let element"></mat-cell>
		</ng-container>

		<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
		<mat-row *matRowDef="let row; columns: displayedColumns;">
		</mat-row>
	</mat-table>
	<mat-paginator [length]="totalLength" [pageSize]="pageSize" [pageSizeOptions]="pageLimit" (page)="changePage($event)">
	</mat-paginator>

	<!-- MODAL -->
	<ng-template #createdatamodal let-modal>
		<form [formGroup]="formData" (ngSubmit)="formSubmit=true; formData.valid && create(formData.value)
       && modal.dismiss('Cross click')">
			<div class="modal-header">
				<h4 class="modal-title" id="modal-create-data">{{ 'GLOBAL.LABEL.CREATEPASSENGER' | translate }}</h4>
				<button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="row">

					<div class="form-group col-12">
						<label>{{ 'GLOBAL.LABEL.FRANCHISE' | translate }}</label>
						<select id="franchise" class="form-control autocomplete" formControlName="franchise"
							[ngClass]="{'is-invalid' : formSubmitAttempt && formData.get('franchise').invalid}">
							<option selected value="">Selecione</option>
							<option *ngFor="let franchise of franchises" [value]="franchise._id"> {{franchise.name}}</option>
						</select>
					</div>

					<div class="form-group col-6">
						<label>{{ 'GLOBAL.LABEL.PERSON' | translate }}</label>
						<div class="input-group">
							<input type="text" class="form-control" matInput placeholder="Escolha uma Pessoa"
								[matAutocomplete]="autoPerson" formControlName="person"
								[ngClass]="{'is-invalid' : formSubmit && formData.get('person').invalid}">
							<mat-autocomplete [displayWith]="displayFnPerson" #autoPerson="matAutocomplete">
								<mat-option *ngFor="let pers of person" [value]="pers" (click)="changePerson(pers)">
									{{ pers.name }}
								</mat-option>
							</mat-autocomplete>
						</div>
					</div>

					<div class="form-group col-6">
						<label>E-mail</label>
						<div class="input-group">
							<input type="text" class="form-control" matInput placeholder="" readonly
								[value]="selectedPerson?.email?selectedPerson?.email:''">
						</div>
					</div>

					<div class="form-group col-6">
						<label>CPF</label>
						<div class="input-group">
							<input type="text" class="form-control" matInput placeholder="" readonly
								[value]="selectedPerson?.cpf?selectedPerson?.cpf:''">
						</div>
					</div>

					<div class="form-group col-6">
						<label>Telefone</label>
						<div class="input-group">
							<input type="text" class="form-control" matInput placeholder="" readonly
								[value]="selectedPerson?.phone?selectedPerson?.phone:''">
						</div>
					</div>

					<div class="form-group col-12">
						<label for="status">{{ 'GLOBAL.LABEL.STATUS' | translate }}</label>
						<div class="input-group">
							<mat-slide-toggle formControlName="status"></mat-slide-toggle>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<input type="submit" value="Criar" class="btn btn-outline-dark">
			</div>
		</form>
	</ng-template>
