services:
  # MongoDB - Admin Database
  admin-mongodb:
    container_name: "toop-admin-mongodb-dev"
    image: "mongo:5.0"
    command: [--auth]
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      MONGO_INITDB_DATABASE: ecbr
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--authenticationDatabase", "admin", "-u", "${MONGO_ADMIN_USER}", "-p", "${MONGO_ADMIN_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - toop-network

  # PostgreSQL - Payment Database
  payment-postgres:
    container_name: "toop-payment-postgres-dev"
    image: postgres:13
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-postgres-payment.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - toop-network

  # Redis - Cache and Queues
  redis:
    container_name: "toop-redis-dev"
    hostname: "toop-redis-dev"
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toop-network

  # Redis Commander - Management UI
  redis-commander:
    container_name: "toop-redis-commander-dev"
    hostname: "toop-redis-commander-dev"
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8181:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - toop-network

  # Admin API Service
  admin-api:
    container_name: "toop-admin-api-dev"
    build:
      context: ./delivery_toop-admin/backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8100:8100"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-admin/backend:/home/node/app
      - /home/node/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 8100
      PRODUCTION: "false"
      MONGO_CONNECT_TYPE: mongodb
      MONGO_ADMIN_USER: ${MONGO_ADMIN_USER}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      URL_MONGO: "mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASSWORD}@admin-mongodb:27017/ecbr?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NOTIFICATION_URL: "http://notification-microservice:8200"
      PAYMENT_URL: "http://payment-microservice:8400"
      DELIVERYMAN_URL: "http://deliveryman-microservice:8300"
      JWT_SECRET: dev-jwt-secret-key
      JWT_SECRET_REFRESH: dev-refresh-secret-key
      NOTIFICATION_API_KEY: dev-app-key-for-service-auth
      FIREBASE_databaseURL: ${FIREBASE_databaseURL}
      FIREBASE_projectId: ${FIREBASE_projectId}
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      admin-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network

  # Payment Microservice
  payment-microservice:
    container_name: "toop-payment-microservice-dev"
    build:
      context: ./delivery_toop-microservice_payment
      dockerfile: Dockerfile
      target: development
    ports:
      - "8400:8400"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-microservice_payment:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 8400
      PRODUCTION: "false"
      LTS: ${LTS:-v1}
      PG_HOST: payment-postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: ${PG_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: dev-jwt-secret-key
      MONGO_ADMIN_USER: ${MONGO_ADMIN_USER}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      URL_MONGO: "mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASSWORD}@admin-mongodb:27017/ecbr?authSource=admin"
      JWT_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        
        -----END PRIVATE KEY-----
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      admin-mongodb:
        condition: service_healthy
      payment-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network

  # Notification Microservice
  notification-microservice:
    container_name: "toop-notification-microservice-dev"
    build:
      context: ./delivery_toop-microservice_notification
      dockerfile: Dockerfile
      target: development
    ports:
      - "8200:8200"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-microservice_notification:/usr/src/app
      - ./delivery_toop-microservice_notification/firebase-adminsdk.json:/usr/src/app/firebase-adminsdk.json
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 8200
      PRODUCTION: "false"
      DB_HOST: admin-mongodb
      DB_PORT: 27017
      DB_DATABASE: ecbr
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FIREBASE_databaseURL: ${FIREBASE_databaseURL}
      FIREBASE_PROJECT_ID: ${FIREBASE_projectId}
      FIREBASE_SERVICE_ACCOUNT_PATH: /usr/src/app/firebase-adminsdk.json
      APP_KEY: ${APP_KEY}
      JWT_SECRET: dev-jwt-secret-key
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      admin-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network

  # Deliveryman Microservice
  deliveryman-microservice:
    container_name: "toop-deliveryman-microservice-dev"
    build:
      context: ./delivery_toop-microservice_deliveryman
      dockerfile: Dockerfile
      target: development
    ports:
      - "8300:8300"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-microservice_deliveryman:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 8300
      PRODUCTION: "false"
      LTS: ${LTS:-v1}
      MONGO_CONNECT_TYPE: mongodb
      MONGO_ADMIN_USER: ${MONGO_ADMIN_USER}
      MONGO_ADMIN_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      URL_MONGO: "mongodb://${MONGO_ADMIN_USER}:${MONGO_ADMIN_PASSWORD}@admin-mongodb:27017/ecbr?authSource=admin"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FIREBASE_databaseURL: ${FIREBASE_databaseURL}
      CLOUD_FIREBASE_PROJECT_ID: ${FIREBASE_projectId}
      CLOUD_FIREBASE_TYPE: service_account
      # Firebase Service Account - Configure via .env vars or firebase-adminsdk.json
      CLOUD_FIREBASE_private_key_id: ${CLOUD_FIREBASE_PRIVATE_KEY_ID}
      CLOUD_FIREBASE_private_key: ${CLOUD_FIREBASE_PRIVATE_KEY}
      CLOUD_FIREBASE_client_email: ${CLOUD_FIREBASE_CLIENT_EMAIL}
      CLOUD_FIREBASE_client_id: ${CLOUD_FIREBASE_CLIENT_ID}
      CLOUD_FIREBASE_auth_uri: ${CLOUD_FIREBASE_AUTH_URI:-https://accounts.google.com/o/oauth2/auth}
      CLOUD_FIREBASE_token_uri: ${CLOUD_FIREBASE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      CLOUD_FIREBASE_auth_provider_x509_cert_url: ${CLOUD_FIREBASE_AUTH_PROVIDER_X509_CERT_URL:-https://www.googleapis.com/oauth2/v1/certs}
      CLOUD_FIREBASE_client_x509_cert_url: ${CLOUD_FIREBASE_CLIENT_X509_CERT_URL}
      JWT_SECRET: dev-jwt-secret-key
      JWT_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        
        -----END PRIVATE KEY-----
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      admin-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toop-network

  # Frontend React - Admin Panel
  frontend-react:
    container_name: "toop-frontend-react-dev"
    image: node:18-alpine
    working_dir: /app
    ports:
      - "4202:4202"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-admin/frontend-react:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: "http://admin-api:8100"
    command: sh -c "npm install && npm run dev"
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network

  # OTA Update Server
  ota-server:
    container_name: "toop-ota-dev"
    build:
      context: ./delivery_toop-ota
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://ota_user:ota_pass@admin-mongodb:27017/toop_ota?authSource=toop_ota
      OTA_PORT: 8500
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8500/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ota_storage:/app/storage
    depends_on:
      admin-mongodb:
        condition: service_healthy
    networks:
      - toop-network

  # Web Client - Consumer Delivery App
  web-client:
    container_name: "toop-web-client-dev"
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4200:4200"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-web-client:/app
      - web_client_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: "http://admin-api:8100"
    command: sh -c "npm install && npx vite --port 4200 --host 0.0.0.0"
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network

  # Frontend React - Store (Loja)
  store:
    container_name: "toop-store-dev"
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4203:4203"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-store:/app
      - store_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: "http://admin-api:8100"
    command: sh -c "npm install && npx vite --port 4203 --host 0.0.0.0"
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network

  # Frontend React - Deliveryman (Entregador)
  deliveryman-app:
    container_name: "toop-deliveryman-app-dev"
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4204:4204"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-deliveryman:/app
      - deliveryman_app_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY: "http://admin-api:8100"
    command: sh -c "npm install && npx vite --port 4204 --host 0.0.0.0"
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - toop-network

  # Landing Page
  landpage:
    container_name: "toop-landpage-dev"
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4205:4205"
    restart: unless-stopped
    volumes:
      - ./delivery_toop-landpage:/app
      - landpage_node_modules:/app/node_modules
    command: sh -c "npm install && npx vite --port 4205 --host 0.0.0.0"
    networks:
      - toop-network

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  frontend_node_modules:
  web_client_node_modules:
  store_node_modules:
  deliveryman_app_node_modules:
  landpage_node_modules:
  ota_storage:

networks:
  toop-network:
    driver: bridge
