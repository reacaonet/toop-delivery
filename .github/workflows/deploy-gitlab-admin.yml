name: Deploy Admin API (GitLab)

# Dispara o pipeline gojadelivery/admin-api -> deploy na VPS via SSH.
# Requer secret: GITLAB_TRIGGER_ADMIN (pipeline trigger token do projeto)

on:
  push:
    branches: [master]
    paths:
      - 'delivery_toop-admin/backend/**'
      - 'docker-compose.backend.yml'

concurrency:
  group: gitlab-deploy-admin
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: github.repository == 'reacaonet/toop-delivery'
    steps:
      - name: Trigger admin-api pipeline
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TRIGGER_ADMIN }}
        run: |
          if [ -z "$GL_TOKEN" ]; then echo "ERRO: secret GITLAB_TRIGGER_ADMIN vazio/nao configurado"; exit 1; fi
          echo "Token length: ${#GL_TOKEN}"
          RESP=$(curl -sS -w "\n[HTTP %{http_code}]" -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fadmin-api/trigger/pipeline" \
            -F "token=$GL_TOKEN" \
            -F ref=main)
          echo "RESPOSTA GITLAB:"
          echo "$RESP"
          case "$RESP" in
            *"[HTTP 201]"*) echo "[DEPLOY TRIGGER OK]" ;;
            *) echo "[DEPLOY TRIGGER FAIL]"; exit 22 ;;
          esac