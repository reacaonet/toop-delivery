name: Deploy Notification (GitLab)

# Dispara o pipeline gojadelivery/notification-microservice -> deploy na VPS via SSH.
# Requer secret: GITLAB_TRIGGER_NOTIFICATION (pipeline trigger token do projeto)

on:
  push:
    branches: [master]
    paths:
      - 'delivery_toop-microservice_notification/**'
      - 'docker-compose.backend.yml'

concurrency:
  group: gitlab-deploy-notification
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification pipeline
        run: |
          curl --fail --silent --show-error -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fnotification-microservice/trigger/pipeline" \
            -F token=${{ secrets.GITLAB_TRIGGER_NOTIFICATION }} \
            -F ref=master