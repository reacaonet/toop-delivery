name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (admin-api) - tsc + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery_toop-admin/backend
    env:
      JWT_SECRET: ci-test-secret
      JWT_SECRET_REFRESH: ci-test-refresh
      MONGO_ADMIN_USER: test
      MONGO_ADMIN_PASSWORD: test
      URL_MONGO: localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Typecheck (tsc)
        run: npm run build
      - name: Testes (jest)
        run: npm test

  admin-panel:
    name: Painel React (admin) - vite build + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery_toop-admin/frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Build (vite)
        run: npm run build
      - name: Testes (vitest)
        run: npm test

  web-apps:
    name: Web app (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - delivery_toop-web-client
          - delivery_toop-store
          - delivery_toop-deliveryman
          - delivery_toop-landpage
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Build (tsc + vite)
        run: npm run build