name: Deploy Deliveryman (GitLab)

# Dispara o pipeline gojadelivery/deliveryman-microservice -> deploy na VPS via SSH.
# Requer secret: GITLAB_TRIGGER_DELIVERYMAN (pipeline trigger token do projeto)

on:
  push:
    branches: [master]
    paths:
      - 'delivery_toop-microservice_deliveryman/**'
      - 'docker-compose.backend.yml'

concurrency:
  group: gitlab-deploy-deliveryman
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deliveryman pipeline
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TRIGGER_DELIVERYMAN }}
        run: |
          if [ -z "$GL_TOKEN" ]; then echo "ERRO: secret GITLAB_TRIGGER_DELIVERYMAN vazio/nao configurado"; exit 1; fi
          echo "Token length: ${#GL_TOKEN}"
          RESP=$(curl -sS -w "\n[HTTP %{http_code}]" -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fdeliveryman-microservice/trigger/pipeline" \
            -F "token=$GL_TOKEN" \
            -F ref=main)
          echo "RESPOSTA GITLAB:"
          echo "$RESP"
          case "$RESP" in
            *"[HTTP 201]"*) echo "[DEPLOY TRIGGER OK]" ;;
            *) echo "[DEPLOY TRIGGER FAIL]"; exit 22 ;;
          esac