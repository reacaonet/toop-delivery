name: Trigger GitLab Deploys

# Dispara o pipeline do projeto GitLab correspondente ao microserviço alterado.
# Requer secrets no GitHub:
#   GITLAB_TRIGGER_ADMIN        -> pipeline trigger token do projeto gojadelivery/admin-api
#   GITLAB_TRIGGER_PAYMENT      -> pipeline trigger token do projeto gojadelivery/payment-microservice
#   GITLAB_TRIGGER_NOTIFICATION -> pipeline trigger token do projeto gojadelivery/notification-microservice
#   GITLAB_TRIGGER_DELIVERYMAN  -> pipeline trigger token do projeto gojadelivery/deliveryman-microservice

on:
  push:
    branches: [master]

concurrency:
  group: gitlab-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-files:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.detect.outputs.admin }}
      payment: ${{ steps.detect.outputs.payment }}
      notification: ${{ steps.detect.outputs.notification }}
      deliveryman: ${{ steps.detect.outputs.deliveryman }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compute changed paths
        id: detect
        shell: bash
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          CHANGED=""
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "CHANGED: $CHANGED"
          echo "admin=false" >> "$GITHUB_OUTPUT"
          echo "payment=false" >> "$GITHUB_OUTPUT"
          echo "notification=false" >> "$GITHUB_OUTPUT"
          echo "deliveryman=false" >> "$GITHUB_OUTPUT"
          for f in $CHANGED; do
            case "$f" in
              delivery_toop-admin/backend/*|docker-compose.backend.yml)
                sed -i 's/^admin=.*/admin=true/' "$GITHUB_OUTPUT" ;;
              delivery_toop-microservice_payment/*)
                sed -i 's/^payment=.*/payment=true/' "$GITHUB_OUTPUT" ;;
              delivery_toop-microservice_notification/*)
                sed -i 's/^notification=.*/notification=true/' "$GITHUB_OUTPUT" ;;
              delivery_toop-microservice_deliveryman/*)
                sed -i 's/^deliveryman=.*/deliveryman=true/' "$GITHUB_OUTPUT" ;;
            esac
          done

  admin-api:
    needs: detect-files
    runs-on: ubuntu-latest
    if: needs.detect-files.outputs.admin == 'true'
    steps:
      - name: Trigger admin-api pipeline
        run: |
          curl --fail --silent --show-error -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fadmin-api/trigger/pipeline" \
            -F token=${{ secrets.GITLAB_TRIGGER_ADMIN }} \
            -F ref=master
  payment:
    needs: detect-files
    runs-on: ubuntu-latest
    if: needs.detect-files.outputs.payment == 'true'
    steps:
      - name: Trigger payment pipeline
        run: |
          curl --fail --silent --show-error -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fpayment-microservice/trigger/pipeline" \
            -F token=${{ secrets.GITLAB_TRIGGER_PAYMENT }} \
            -F ref=master
  notification:
    needs: detect-files
    runs-on: ubuntu-latest
    if: needs.detect-files.outputs.notification == 'true'
    steps:
      - name: Trigger notification pipeline
        run: |
          curl --fail --silent --show-error -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fnotification-microservice/trigger/pipeline" \
            -F token=${{ secrets.GITLAB_TRIGGER_NOTIFICATION }} \
            -F ref=master
  deliveryman:
    needs: detect-files
    runs-on: ubuntu-latest
    if: needs.detect-files.outputs.deliveryman == 'true'
    steps:
      - name: Trigger deliveryman pipeline
        run: |
          curl --fail --silent --show-error -X POST \
            "https://gitlab.com/api/v4/projects/gojadelivery%2Fdeliveryman-microservice/trigger/pipeline" \
            -F token=${{ secrets.GITLAB_TRIGGER_DELIVERYMAN }} \
            -F ref=master